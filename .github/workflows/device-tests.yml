name: Device tests

# Runs the on-device ad-load harness (tests/Plugin.AdMob.DeviceTests) on an Android emulator
# and an iOS simulator. The harness runs the plugin's default consent flow, then loads each
# format with Google's test ad units and asserts OnAdLoaded fires. Runs on PRs and main pushes
# (source), and is reusable (workflow_call) for the nightly job (published package) and the
# MAUI auto-bump gate (source).
#
# GATING MODEL — banner is the hard gate. Measured on the hosted runner (headless, software GPU,
# google_apis): banner and all four full-screen formats load; native/native-video do not, because
# native demo creatives need market:// click resolution and therefore a Play Store system image.
# Set require_all_formats: true only against a google_apis_playstore AVD on a self-hosted runner.

on:
  pull_request:
    paths-ignore: [ 'docs/**', '**/*.md' ]
  push:
    branches: [ main ]
    paths-ignore: [ 'docs/**', '**/*.md' ]
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
      use_published:
        description: Reference the published NuGet package instead of the source.
        required: false
        type: boolean
        default: false
      admob_version:
        required: false
        type: string
        default: ''
      maui_version:
        required: false
        type: string
        default: ''
      require_all_formats:
        description: Hard-fail unless every format loads (only meaningful on a -gpu host runner).
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      use_published:
        description: Reference the published NuGet package instead of the source.
        type: boolean
        default: true
      admob_version:
        description: Package version to test (blank = latest).
        type: string
        default: ''
      maui_version:
        description: MAUI version to pin (blank = float).
        type: string
        default: ''
      require_all_formats:
        description: Hard-fail unless every format loads.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  android:
    name: android emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build test APK
        run: |
          props=""
          if [ "${{ inputs.use_published }}" = "true" ]; then props="-p:UsePublishedAdMob=true"; fi
          if [ -n "${{ inputs.admob_version }}" ]; then props="$props -p:AdMobPackageVersion=${{ inputs.admob_version }}"; fi
          if [ -n "${{ inputs.maui_version }}" ]; then props="$props -p:MauiVersion=${{ inputs.maui_version }}"; fi
          echo "Build props: $props"
          # -p:TargetFrameworks (not -f) so restore is single-TFM: `-f` leaves restore
          # cross-targeting, which would fail with NETSDK1147 for the iOS TFM on this runner.
          #
          # EmbedAssembliesIntoApk=true is REQUIRED here. A Debug Android build otherwise uses
          # Fast Deployment, which keeps the managed assemblies OUT of the APK and expects the
          # IDE / `dotnet build -t:Run` to push them separately. Installing such an APK with
          # plain `adb install` yields an app that aborts at startup with
          # "No assemblies found in .../.__override__/x86_64" before a single line is logged.
          dotnet build tests/Plugin.AdMob.DeviceTests/Plugin.AdMob.DeviceTests.csproj -c Debug -p:TargetFrameworks=net10.0-android -p:EmbedAssembliesIntoApk=true $props
          apk=$(find "$PWD/tests/Plugin.AdMob.DeviceTests/bin" -name '*-Signed.apk' | head -1)
          if [ -z "$apk" ]; then apk=$(find "$PWD/tests/Plugin.AdMob.DeviceTests/bin" -name '*.apk' | head -1); fi
          if [ -z "$apk" ]; then echo "::error::No APK produced"; exit 1; fi
          echo "APK=$apk" >> "$GITHUB_ENV"
          echo "REQUIRE_ALL=${{ inputs.require_all_formats }}" >> "$GITHUB_ENV"
          echo "Built $apk"

      - name: Run harness on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # Embedding the assemblies takes the APK from ~13 MB to ~90 MB; give the AVD headroom
          # so the install can't fail with INSTALL_FAILED_INSUFFICIENT_STORAGE.
          disk-size: 8G
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash tests/ci/run-android-harness.sh

  ios:
    name: ios simulator
    # .NET for iOS on the 10.0.4xx SDK requires Xcode 27.1, which only the xcode-27 (preview)
    # image has; macos-latest stops at Xcode 26.6, so the lane failed on every run from July to
    # October 2026.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      # .NET for iOS requires one exact Xcode version, and the image's default (or newest) Xcode
      # can be a different one, so select the version the installed iOS SDK pack asks for.
      - name: Select the Xcode the iOS workload requires
        run: |
          root="${DOTNET_ROOT:-$(dirname "$(readlink -f "$(command -v dotnet)")")}"
          props=$(ls -d "$root"/packs/Microsoft.iOS.Sdk.net10.0_*/*/targets/Microsoft.iOS.Sdk.Versions.props | sort -V | tail -1)
          xcode=$(sed -n 's:.*<_RecommendedXcodeVersion>\(.*\)</_RecommendedXcodeVersion>.*:\1:p' "$props")
          app=$(ls -d "/Applications/Xcode_$xcode.app" "/Applications/Xcode_$xcode".*.app 2>/dev/null | head -1 || true)
          if [ -z "$app" ]; then
            echo "::error::The iOS workload requires Xcode $xcode, which this image doesn't have."
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$app"
          xcodebuild -version

      - name: Build for the simulator
        run: |
          props=""
          if [ "${{ inputs.use_published }}" = "true" ]; then props="-p:UsePublishedAdMob=true"; fi
          if [ -n "${{ inputs.admob_version }}" ]; then props="$props -p:AdMobPackageVersion=${{ inputs.admob_version }}"; fi
          if [ -n "${{ inputs.maui_version }}" ]; then props="$props -p:MauiVersion=${{ inputs.maui_version }}"; fi
          dotnet build tests/Plugin.AdMob.DeviceTests/Plugin.AdMob.DeviceTests.csproj -c Debug -p:TargetFrameworks=net10.0-ios -p:RuntimeIdentifier=iossimulator-arm64 $props
          app=$(find tests/Plugin.AdMob.DeviceTests/bin -name '*.app' -type d | head -1)
          echo "APP=$app" >> "$GITHUB_ENV"
          echo "Built $app"

      - name: Boot simulator, launch, scrape console
        run: |
          set -euo pipefail
          # Use an iPhone that already exists on the newest iOS runtime; a device type picked by
          # name may not be compatible with that runtime.
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if ".iOS-" in r), key=lambda r: [int(x) for x in r.rsplit("iOS-", 1)[1].split("-")])
          for runtime in reversed(runtimes):
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"], file=sys.stdout)
                      print("Using simulator: " + device["name"] + " (" + runtime + ")", file=sys.stderr)
                      sys.exit()
          ')
          if [ -z "$udid" ]; then echo "::error::No iPhone simulator available"; xcrun simctl list devices available; exit 1; fi
          # `boot` returns as soon as the boot is *initiated*; bootstatus -b boots if needed and
          # blocks until the device is actually usable. install/launch both gate on device state.
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$APP"
          # Redirect rather than pipe: for a backgrounded pipeline $! is tee, so the later kill
          # would tear down the log reader and leave the app running.
          xcrun simctl launch --console-pty "$udid" com.plugin.admob.devicetests > sim.log 2>&1 &
          launch_pid=$!
          for _ in $(seq 1 120); do
            if grep -qF "SUMMARY_ALL" sim.log 2>/dev/null; then break; fi
            sleep 5
          done
          kill "$launch_pid" 2>/dev/null || true
          echo "===== harness log ====="; grep "AdMobHarness:" sim.log || true; echo "======================="
          if ! grep -qF "AdMobHarness:" sim.log; then
            echo "::error::iOS harness produced no output — the app never started."
            sed -n '1,40p' sim.log || true
            exit 1
          fi
          if ! grep -F "format=consent" sim.log | grep -q "status=PASS"; then
            echo "::error::Automatic consent never completed, so no consent-gated ad can load."
            exit 1
          fi
          if ! grep -F "SUMMARY_BANNER" sim.log | tail -1 | grep -q "status=PASS"; then
            echo "::error::Banner ad failed to load against Google's test ad unit."
            exit 1
          fi
          echo "Device-test gate passed (consent and banner)."
